# Canary workflow for cajeX Live Evidence: deliberately without security
# scanning, and with an action pinned to a tag rather than a commit SHA, so
# cajeX's checks have something real to find.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Canary build. No security scanning here, on purpose."
